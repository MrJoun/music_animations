<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timing Lab — Karaoke Sync</title>
  <link rel="stylesheet" href="css/timing-lab.css">
</head>
<body>
  <div class="timing-lab">
    <header class="lab-header">
      <h1>Timing Lab</h1>
      <a href="index.html">← Back to Reel Studio</a>
    </header>

    <section class="lab-controls">
      <label for="audio-input" class="btn btn-primary">Choose Song</label>
      <input type="file" id="audio-input" accept="audio/*">
      <p id="track-name">No track loaded</p>
      <p id="status-msg" class="muted">Load an MP3 — auto-loads <code>.analysis</code> sidecar when present.</p>

      <div class="transport">
        <button type="button" id="play-btn" class="btn" disabled>Play</button>
        <span id="time-current">0:00</span>
        <input type="range" id="seek-slider" min="0" max="1000" value="0" step="0.1" disabled>
        <span id="time-duration">0:00</span>
      </div>

      <div class="sync-row">
        <label for="sync-slider">Sync offset <span id="sync-val">+0.00s</span></label>
        <input type="range" id="sync-slider" min="-150" max="50" value="0" step="1" disabled>
      </div>
    </section>

    <main class="karaoke-stage">
      <div id="karaoke-line" aria-live="polite"></div>
      <p id="next-line"></p>
    </main>

    <div class="debug-toggle">
      <label class="btn">
        <input type="checkbox" id="debug-toggle"> Show debug panel
      </label>
    </div>

    <aside id="debug-panel" class="debug-panel hidden" aria-label="Timing debug">
      <dl>
        <dt>currentTime</dt><dd id="dbg-current">—</dd>
        <dt>syncTime</dt><dd id="dbg-sync">—</dd>
        <dt>lineIndex</dt><dd id="dbg-line">—</dd>
        <dt>activeWord</dt><dd id="dbg-word">—</dd>
        <dt>word start</dt><dd id="dbg-start">—</dd>
        <dt>word end</dt><dd id="dbg-end">—</dd>
        <dt>matched</dt><dd id="dbg-matched">—</dd>
        <dt>schedule source</dt><dd id="dbg-source">—</dd>
      </dl>
    </aside>
  </div>

  <script src="js/karaoke-clock.js"></script>
  <script src="js/analysis-pack.js"></script>
  <script src="js/lyrics-cache.js"></script>
  <script src="js/id3-lyrics.js"></script>
  <script src="js/lyrics-fetcher.js"></script>
  <script src="js/timing-lab.js"></script>
</body>
</html>
